<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <title>APP Lanchonete</title>
</head>

<body>
    <div class="container-fluid">
        <header>

        </header>
        <main>
            <div class="container mt-4">
                <h2>Cadastro de Produtos</h2>
                <form id="frmProduto">
                    <div class="mb-3">
                        <label for="nome">Produto:</label>
                        <input type="text" name="nome" id="nome" class="form-control" require>
                        
                        <label for="nome">Valor:</label>
                        <input type="text" name="valorvenda" id="valorvenda" class="form-control" require>
                        
                        <label for="nome">Categoria:</label>
                        <div class="input-group">
                            <input type="text" name="categoria" id="categoria" class="form-control" readonly require>
                            <input type="text" name="catnome" id="catnome" class="form-control" readonly require> 
                            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">Procurar</button>                            
                        </div>
                    </div>
                    <button class="btn btn-primary" type="submit">GRAVAR</button>
                </form>
                  
                  <!-- Modal -->
                  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                    <div class="modal-dialog">
                      <div class="modal-content">
                        <div class="modal-header">
                          <h1 class="modal-title fs-5" id="exampleModalLabel">Seleção de Categorias</h1>
                          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                           <div class="input-group">
                                <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
                                <button class="btn btn-outline-success my-2 my-sm-0" onclick="filtraprodutos()">Pesquisar</button>
                           </div>
                           <div class="container mt-3">
                                <div class="row">
                                    <div class="col-sm-3">
                                        <b>ID:</b>
                                    </div>
                                    <div class="col-sm-2">
                                        <b>Categorias:</b>
                                    </div>
                                </div>
                            </div>
                            <div class="container" id="gridCategoria">
                                <!-- aqui o javascript cria a tabela -->
                            </div>
                        </div>
                        <div class="modal-footer">
                          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                          <button type="button" class="btn btn-primary">Save changes</button>
                        </div>
                      </div>
                    </div>
                  </div>

            </div>
            <!-- Listagem visual HTML CSS -->
            <div class="container mt-3">
                <div class="row">
                    <div class="col-sm-3">
                        <b>Produto</b>
                    </div>
                    <div class="col-sm-2">
                        <b>Valor</b>
                    </div>
                    <div class="col-sm-1">
                        <b>Categoria</b>
                    </div>
                    <div class="col-sm-4">
                        <b>Operações</b>
                    </div>
                </div>
            </div>
            <div class="container" id="gridProduto">
                <!-- aqui o javascript cria a tabela -->
            </div>
            <!-- script para conectar ao servicor da api e chamar o serviço especifico -->
        </main>
        <footer>

        </footer>
    </div>
    <script src="index.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>

</body>

</html>
